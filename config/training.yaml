# ──────────────────────────────────────────────────────────────────────
# Training Hyperparameters
# ──────────────────────────────────────────────────────────────────────
# Edit this file to tune training behavior without modifying train.py.
# These values are unpacked directly into model.train(**config).

# ── Optimization ─────────────────────────────────────────────────────
optimizer: SGD    # Switched back to SGD
lr0: 0.01               # SGD requires a much higher learning rate than AdamW! (0.01 instead of 0.001)
amp: false              # Disable mixed precision to prevent NaN on certain GPUs
batch: 32                # MUST stay at 16 to prevent P2 layer from crashing 24GB VRAM!
patience: 50            # Early stopping after N epochs without improvement
dropout: 0.30           # Randomly drops 30% of neurons to prevent overfitting
label_smoothing: 0.1    # Targets 90% confidence instead of 100%
box: 4.0               # Lower box loss weight — prioritize detection over tight boxes

# ── Augmentation ─────────────────────────────────────────────────────
degrees: 180.0          # Random rotation up to 180 degrees (pollen has no fixed orientation)
fliplr: 0.5             # 50% horizontal flip
flipud: 0.5             # 50% vertical flip
scale: 0.1              # LITE: Reduced from 0.3 to 0.1 (mild scale variation)
translate: 0.1          # LITE: Reduced from 0.3 to 0.1 (mild shift)
hsv_h: 0.015            # LITE: Drastically reduced hue shift (pollen color matters)
hsv_s: 0.3              # LITE: Reduced from 0.8 (preserves natural saturation)
hsv_v: 0.3              # LITE: Reduced from 0.8 (preserves natural brightness)
mosaic: 0.5             # LITE: Reduced from 1.0 (Stitch 4 images together 50% of the time)
mixup: 0.0              # LITE: Disabled (too distorting for pollen)
copy_paste: 0.0         # Disabled
close_mosaic: 10        # Keep mosaic active until the end of training

# ── System ───────────────────────────────────────────────────────────
cache: disk              # Load entire dataset into 64GB System RAM to eliminate disk bottlenecks
workers: 8              # Dataloader threads (increased to feed GPU faster from RAM)
max_det: 1500           # Max detections per image (default 300 is too low for dense pollen)
multi_scale: false      # Disable random resolution changes during training
